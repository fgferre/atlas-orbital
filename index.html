<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23040b14'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%2300e5ff' stroke-width='4'/%3E%3Ccircle cx='44' cy='20' r='4' fill='%23f9c74f'/%3E%3C/svg%3E"
    />
    <title>Atlas Orbital</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
      }

      #app-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9998;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at center, #1a1a2e 0%, #000 100%);
        color: white;
        font-family: "Segoe UI", sans-serif;
        transition: opacity 0.3s ease;
      }

      #app-boot-splash[data-state="handoff"] {
        opacity: 0;
      }

      #app-boot-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.03;
        background-image:
          linear-gradient(to right, #ffffff 1px, transparent 1px),
          linear-gradient(to bottom, #ffffff 1px, transparent 1px);
        background-size: 40px 40px;
        animation: boot-grid-drift 28s linear infinite;
      }

      .boot-shell {
        position: relative;
        z-index: 1;
        display: flex;
        width: min(100%, 56rem);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
      }

      .boot-title {
        margin: 0 0 3rem;
        font-size: clamp(2.25rem, 5vw, 3.75rem);
        font-weight: 300;
        letter-spacing: 0.2em;
        text-align: center;
        background: linear-gradient(
          to bottom,
          #ffffff,
          rgba(255, 255, 255, 0.45)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      .boot-orbital {
        position: relative;
        display: flex;
        width: 12rem;
        height: 12rem;
        margin-bottom: 3rem;
        align-items: center;
        justify-content: center;
      }

      .boot-sun {
        position: absolute;
        z-index: 2;
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        background: linear-gradient(135deg, #fde047, #f97316);
        box-shadow: 0 0 40px rgba(255, 165, 0, 0.55);
        animation: boot-sun-pulse 1.8s ease-in-out infinite;
      }

      .boot-ring-glow {
        position: absolute;
        width: 9rem;
        height: 9rem;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.12);
        animation: boot-ring-pulse 2.8s ease-in-out infinite;
      }

      .boot-orbit {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
      }

      .boot-orbit--1 {
        width: 4rem;
        height: 4rem;
        animation: boot-spin 3s linear infinite;
      }

      .boot-orbit--2 {
        width: 6rem;
        height: 6rem;
        border-color: rgba(255, 255, 255, 0.12);
        animation: boot-spin 5s linear infinite;
      }

      .boot-orbit--3 {
        width: 8rem;
        height: 8rem;
        animation: boot-spin 7s linear infinite;
      }

      .boot-orbit--4 {
        width: 11rem;
        height: 11rem;
        animation: boot-spin 12s linear infinite;
      }

      .boot-planet {
        position: absolute;
        border-radius: 999px;
      }

      .boot-planet--1 {
        top: 50%;
        right: -0.25rem;
        width: 0.375rem;
        height: 0.375rem;
        background: #d1d5db;
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      }

      .boot-planet--2 {
        top: 0;
        left: 50%;
        width: 0.625rem;
        height: 0.625rem;
        transform: translate(-50%, -0.25rem);
        background: #60a5fa;
        box-shadow: 0 0 8px rgba(59, 130, 246, 0.8);
      }

      .boot-planet--3 {
        bottom: 50%;
        left: -0.375rem;
        width: 0.5rem;
        height: 0.5rem;
        background: #f87171;
        box-shadow: 0 0 8px rgba(248, 113, 113, 0.8);
      }

      .boot-planet--4 {
        right: 25%;
        bottom: 0;
        width: 1rem;
        height: 1rem;
        background: #fdba74;
        box-shadow: 0 0 10px rgba(253, 186, 116, 0.8);
      }

      .boot-progress-shell {
        width: min(100%, 28rem);
      }

      .boot-progress-meta {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.5rem;
        font-size: 0.75rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(34, 211, 238, 0.8);
      }

      .boot-progress-track {
        position: relative;
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }

      .boot-progress-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 38%;
        background: #22d3ee;
        box-shadow: 0 0 10px rgba(34, 211, 238, 0.45);
        animation: boot-progress 2.2s ease-in-out infinite;
      }

      .boot-progress-sweep {
        position: absolute;
        inset: 0 auto 0 0;
        width: 6rem;
        background: linear-gradient(
          to right,
          transparent,
          rgba(255, 255, 255, 0.8),
          transparent
        );
        animation: boot-sweep 1.8s ease-in-out infinite;
      }

      .boot-stage {
        margin-top: 1rem;
        text-align: center;
        font-size: 0.6875rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.32);
      }

      @keyframes boot-spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes boot-grid-drift {
        from {
          transform: translate3d(0, 0, 0);
        }
        to {
          transform: translate3d(40px, 40px, 0);
        }
      }

      @keyframes boot-progress {
        0% {
          transform: translateX(-30%);
          width: 22%;
        }
        50% {
          transform: translateX(95%);
          width: 46%;
        }
        100% {
          transform: translateX(260%);
          width: 22%;
        }
      }

      @keyframes boot-sweep {
        from {
          transform: translateX(-180%);
        }
        to {
          transform: translateX(430%);
        }
      }

      @keyframes boot-sun-pulse {
        0%,
        100% {
          transform: scale(0.96);
        }
        50% {
          transform: scale(1.05);
        }
      }

      @keyframes boot-ring-pulse {
        0%,
        100% {
          opacity: 0.14;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.32;
          transform: scale(1.02);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-boot-splash" aria-hidden="true">
      <div class="boot-shell">
        <h1 class="boot-title">ATLAS ORBITAL</h1>
        <div class="boot-orbital">
          <div class="boot-sun"></div>
          <div class="boot-ring-glow"></div>
          <div class="boot-orbit boot-orbit--1">
            <span class="boot-planet boot-planet--1"></span>
          </div>
          <div class="boot-orbit boot-orbit--2">
            <span class="boot-planet boot-planet--2"></span>
          </div>
          <div class="boot-orbit boot-orbit--3">
            <span class="boot-planet boot-planet--3"></span>
          </div>
          <div class="boot-orbit boot-orbit--4">
            <span class="boot-planet boot-planet--4"></span>
          </div>
        </div>
        <div class="boot-progress-shell">
          <div class="boot-progress-meta">
            <span>Initializing Simulation</span>
            <span>Boot</span>
          </div>
          <div class="boot-progress-track">
            <div class="boot-progress-fill"></div>
            <div class="boot-progress-sweep"></div>
          </div>
          <div class="boot-stage">Bootstrapping application shell</div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
