name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  visual-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      # Pixel baselines are platform-specific. Keep the reviewed Windows
      # baseline as the single visual source of truth instead of silently
      # accepting an unreviewed Linux render.
      - name: Visual regression
        run: npm run test:e2e -- e2e/boot.spec.ts --grep "boot visual identity" --workers=1

      - name: Upload visual regression results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-regression-results-windows
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    needs: visual-regression
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Quality gates run in the same job (and therefore reuse the single
      # `npm ci` above) and BEFORE `Build` / `Upload artifact`, so a failing
      # gate aborts the job with nothing published — the previously deployed
      # Pages version stays live.
      #
      - name: Lint
        run: npm run lint

      # `test:coverage` (not `test:run`) so the coverage thresholds declared
      # in `vitest.config.ts` actually gate the deploy. `test:run` never
      # measures coverage, so a regression below the ratchet floors would ship
      # unnoticed. The v8 instrumentation adds only a few seconds over the bare
      # run on this suite (~100 unit files) — a worthwhile cost for the gate.
      - name: Unit tests + coverage thresholds
        run: npm run test:coverage

      - name: Docs check
        run: npm run docs:check

      - name: Build
        run: npm run build

      # The suite includes real WebGL/SwiftShader boot, focus, accessibility,
      # CSP, responsive, and pixel-regression coverage. Keep one worker: GPU
      # browser contexts are the constrained resource on hosted runners, and
      # parallelizing these twelve scenarios makes the gate less reliable.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e -- --workers=1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
